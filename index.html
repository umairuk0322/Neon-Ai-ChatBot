<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Neon AI — OpenRouter Reasoning</title>
    <style>
        /* ============================================
               RESET & BASE
            ============================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-cyan: #00f5ff;
            --neon-purple: #b400ff;
            --neon-pink: #ff00c8;
            --neon-blue: #0066ff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --text-primary: #f0f0ff;
            --text-secondary: #a0a0c0;
            --text-muted: #606080;
            --bg-dark: #0a0a12;
            --bg-panel: rgba(10, 10, 20, 0.75);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --shadow-neon-cyan: 0 0 20px rgba(0, 245, 255, 0.3);
            --shadow-neon-purple: 0 0 20px rgba(180, 0, 255, 0.3);
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --font-mono: 'Cascadia Code', 'Fira Code', monospace;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            margin: 0;
            position: relative;
        }

        /* ============================================
               BACKGROUND — Particles + Grid
            ============================================ */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at 20% 50%, rgba(0, 245, 255, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(180, 0, 255, 0.04) 0%, transparent 60%),
                var(--bg-dark);
        }

        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(0, 245, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 245, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
        }

        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 12s ease-in-out infinite alternate;
        }
        .glow-orb--cyan {
            width: 300px;
            height: 300px;
            background: rgba(0, 245, 255, 0.08);
            top: -80px;
            right: -80px;
            animation-delay: 0s;
        }
        .glow-orb--purple {
            width: 400px;
            height: 400px;
            background: rgba(180, 0, 255, 0.08);
            bottom: -120px;
            left: -120px;
            animation-delay: -4s;
        }
        .glow-orb--pink {
            width: 200px;
            height: 200px;
            background: rgba(255, 0, 200, 0.06);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -8s;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(20px, -30px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
            100% {
                transform: translate(10px, -10px) scale(1.05);
            }
        }

        /* ============================================
               APP CONTAINER
            ============================================ */
        .app {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 960px;
            height: 100vh;
            height: 100dvh;
            max-height: 780px;
            background: var(--bg-panel);
            backdrop-filter: blur(24px) saturate(1.2);
            -webkit-backdrop-filter: blur(24px) saturate(1.2);
            border-radius: var(--radius-xl);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow), 0 0 60px rgba(0, 245, 255, 0.04);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: border-color 0.4s, box-shadow 0.4s;
        }
        .app:hover {
            border-color: rgba(0, 245, 255, 0.15);
            box-shadow: var(--glass-shadow), 0 0 80px rgba(0, 245, 255, 0.06);
        }

        /* ============================================
               SCROLLBAR
            ============================================ */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--neon-cyan);
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(0, 245, 255, 0.3);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--neon-purple);
            box-shadow: 0 0 16px rgba(180, 0, 255, 0.4);
        }

        /* ============================================
               HEADER
            ============================================ */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            gap: 8px;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            box-shadow: 0 0 24px rgba(0, 245, 255, 0.2);
            flex-shrink: 0;
            transition: box-shadow 0.4s, transform 0.4s;
        }
        .logo:hover {
            box-shadow: 0 0 40px rgba(0, 245, 255, 0.35);
            transform: scale(1.04);
        }
        .logo svg {
            width: 22px;
            height: 22px;
            fill: #fff;
        }

        .brand {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }
        .brand-name {
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .brand-status {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.6rem;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #00ff88;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.5);
            animation: pulseDot 2s ease-in-out infinite;
        }
        .status-dot--offline {
            background: #ff4444;
            box-shadow: 0 0 12px rgba(255, 68, 68, 0.4);
            animation: none;
        }
        @keyframes pulseDot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.8);
            }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .header-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition-smooth);
            position: relative;
            font-size: 1rem;
        }
        .header-btn:hover {
            background: rgba(0, 245, 255, 0.08);
            color: var(--text-primary);
            transform: scale(1.05);
        }
        .header-btn:active {
            transform: scale(0.92);
        }
        .header-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .header-btn--danger:hover {
            background: rgba(255, 68, 68, 0.12);
            color: #ff6666;
        }

        .header-btn--active {
            color: var(--neon-cyan);
        }

        /* ============================================
               MAIN — Chat Area
            ============================================ */
        .main {
            flex: 1;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* ============================================
               WELCOME SCREEN
            ============================================ */
        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            text-align: center;
            animation: fadeUp 0.8s ease-out;
        }
        .welcome-icon {
            font-size: 3.6rem;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 30px rgba(0, 245, 255, 0.2));
            animation: floatIcon 4s ease-in-out infinite;
        }
        @keyframes floatIcon {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        .welcome h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }
        .welcome p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 28px;
            max-width: 400px;
        }
        .welcome .reasoning-badge {
            display: inline-block;
            background: rgba(0, 245, 255, 0.06);
            border: 1px solid rgba(0, 245, 255, 0.1);
            border-radius: 40px;
            padding: 4px 16px;
            font-size: 0.7rem;
            color: var(--neon-cyan);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 18px;
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.04);
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-width: 540px;
            width: 100%;
        }
        .suggestion-btn {
            padding: 10px 20px;
            border-radius: 40px;
            border: 1px solid rgba(0, 245, 255, 0.15);
            background: rgba(0, 245, 255, 0.04);
            color: var(--text-secondary);
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-smooth);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            font-family: var(--font-main);
            letter-spacing: 0.2px;
            white-space: nowrap;
        }
        .suggestion-btn:hover {
            border-color: var(--neon-cyan);
            background: rgba(0, 245, 255, 0.08);
            color: var(--text-primary);
            box-shadow: 0 0 24px rgba(0, 245, 255, 0.08);
            transform: translateY(-2px) scale(1.02);
        }
        .suggestion-btn:active {
            transform: scale(0.96);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================
               MESSAGES CONTAINER
            ============================================ */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px 18px 8px 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            scroll-behavior: smooth;
        }
        .messages-container--hidden {
            display: none;
        }

        /* ============================================
               MESSAGE BUBBLES
            ============================================ */
        .message {
            display: flex;
            gap: 10px;
            max-width: 82%;
            animation: messageIn 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            flex-shrink: 0;
            position: relative;
        }
        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(14px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .message--user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .message--ai {
            align-self: flex-start;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 2px;
            position: relative;
            transition: box-shadow 0.3s;
        }
        .message--user .message-avatar {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.2);
            color: #fff;
        }
        .message--ai .message-avatar {
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink));
            box-shadow: 0 0 20px rgba(180, 0, 255, 0.2);
            color: #fff;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: var(--radius-md);
            position: relative;
            word-break: break-word;
            line-height: 1.55;
            font-size: 0.92rem;
            transition: box-shadow 0.3s;
            min-width: 60px;
        }
        .message--user .message-bubble {
            background: rgba(0, 245, 255, 0.05);
            border: 1px solid rgba(0, 245, 255, 0.15);
            box-shadow: 0 0 24px rgba(0, 245, 255, 0.04);
            border-bottom-right-radius: 4px;
            color: var(--text-primary);
        }
        .message--ai .message-bubble {
            background: rgba(180, 0, 255, 0.04);
            border: 1px solid rgba(180, 0, 255, 0.12);
            box-shadow: 0 0 24px rgba(180, 0, 255, 0.04);
            border-bottom-left-radius: 4px;
            color: var(--text-primary);
        }
        .message--ai .message-bubble code {
            font-family: var(--font-mono);
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--neon-cyan);
        }
        .message--ai .message-bubble pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
            border: 1px solid rgba(0, 245, 255, 0.06);
        }
        .message--ai .message-bubble pre code {
            background: transparent;
            padding: 0;
            color: var(--text-secondary);
        }

        .message-time {
            font-size: 0.6rem;
            color: var(--text-muted);
            margin-top: 4px;
            display: block;
            letter-spacing: 0.3px;
            opacity: 0.7;
        }
        .message--user .message-time {
            text-align: right;
        }
        .message--ai .message-time {
            text-align: left;
        }

        .message-actions {
            display: flex;
            gap: 2px;
            margin-top: 4px;
            opacity: 0;
            transition: opacity 0.25s;
        }
        .message:hover .message-actions,
        .message-actions--visible {
            opacity: 1;
        }
        .message-actions button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 3px 6px;
            border-radius: 6px;
            font-size: 0.7rem;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            gap: 3px;
            font-family: var(--font-main);
        }
        .message-actions button:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
        }
        .message-actions button svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .message-actions .copy-btn--copied {
            color: var(--neon-cyan);
        }

        /* ============================================
               REASONING BADGE on AI messages
            ============================================ */
        .reasoning-badge-msg {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(0, 245, 255, 0.06);
            border: 1px solid rgba(0, 245, 255, 0.08);
            border-radius: 20px;
            padding: 2px 10px 2px 8px;
            font-size: 0.55rem;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-top: 4px;
            opacity: 0.7;
            font-weight: 500;
        }
        .reasoning-badge-msg svg {
            width: 10px;
            height: 10px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
        }

        /* ============================================
               TYPING INDICATOR
            ============================================ */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            margin-left: 52px;
            margin-bottom: 4px;
            align-self: flex-start;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .typing-indicator--active {
            opacity: 1;
        }
        .typing-indicator .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--neon-cyan);
            box-shadow: 0 0 12px rgba(0, 245, 255, 0.4);
            animation: typingBounce 1.4s ease-in-out infinite;
        }
        .typing-indicator .dot:nth-child(2) {
            animation-delay: 0.2s;
            background: var(--neon-purple);
            box-shadow: 0 0 12px rgba(180, 0, 255, 0.4);
        }
        .typing-indicator .dot:nth-child(3) {
            animation-delay: 0.4s;
            background: var(--neon-pink);
            box-shadow: 0 0 12px rgba(255, 0, 200, 0.4);
        }
        @keyframes typingBounce {
            0%,
            60%,
            100% {
                transform: translateY(0) scale(1);
            }
            30% {
                transform: translateY(-10px) scale(1.2);
            }
        }

        /* ============================================
               INPUT AREA
            ============================================ */
        .input-area {
            padding: 12px 18px 14px 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: border-color 0.4s, box-shadow 0.4s;
        }
        .input-area:focus-within {
            border-color: rgba(0, 245, 255, 0.15);
            box-shadow: 0 -4px 30px rgba(0, 245, 255, 0.03);
        }

        .input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            position: relative;
        }

        .input-field-wrap {
            flex: 1;
            position: relative;
            display: flex;
            align-items: flex-end;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-md);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: var(--transition-smooth);
            padding: 4px 4px 4px 14px;
            min-height: 44px;
        }
        .input-field-wrap:focus-within {
            border-color: rgba(0, 245, 255, 0.2);
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.04);
            background: rgba(255, 255, 255, 0.04);
        }

        .input-field-wrap textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 0.92rem;
            font-family: var(--font-main);
            resize: none;
            padding: 10px 0;
            line-height: 1.5;
            min-height: 24px;
            max-height: 120px;
            width: 100%;
            transition: height 0.1s;
        }
        .input-field-wrap textarea::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }
        .input-field-wrap textarea::-webkit-scrollbar {
            width: 2px;
        }
        .input-field-wrap textarea::-webkit-scrollbar-thumb {
            background: var(--neon-cyan);
            border-radius: 10px;
        }

        .input-char-counter {
            font-size: 0.6rem;
            color: var(--text-muted);
            padding: 4px 6px;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            opacity: 0.6;
            transition: color 0.3s;
            align-self: flex-end;
            margin-bottom: 6px;
        }
        .input-char-counter--near-limit {
            color: #ffaa44;
            opacity: 1;
        }
        .input-char-counter--limit {
            color: #ff4444;
            opacity: 1;
        }

        .input-tools {
            display: flex;
            align-items: center;
            gap: 2px;
            padding-right: 2px;
            align-self: flex-end;
            margin-bottom: 4px;
        }
        .input-tool-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition-smooth);
            font-size: 1rem;
        }
        .input-tool-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            transform: scale(1.05);
        }
        .input-tool-btn:active {
            transform: scale(0.9);
        }
        .input-tool-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ============================================
               SEND BUTTON — PREMIUM NEON
            ============================================ */
        .send-btn {
            position: relative;
            width: 54px;
            height: 54px;
            min-width: 54px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.25), 0 0 60px rgba(180, 0, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: visible;
            touch-action: manipulation;
            will-change: transform;
        }
        .send-btn::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            z-index: -1;
            filter: blur(16px);
            opacity: 0.4;
            transition: opacity 0.4s, filter 0.4s;
        }
        .send-btn::after {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: 50%;
            background: rgba(10, 10, 20, 0.35);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 0;
            transition: background 0.3s;
        }
        .send-btn .btn-inner {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: transparent;
            transition: transform 0.3s;
        }
        .send-btn svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s;
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.2));
        }
        .send-btn .btn-spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 2.5px solid rgba(255, 255, 255, 0.15);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .send-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 50px rgba(0, 245, 255, 0.35), 0 0 80px rgba(180, 0, 255, 0.2);
        }
        .send-btn:hover::before {
            opacity: 0.7;
            filter: blur(24px);
        }
        .send-btn:hover svg {
            transform: rotate(12deg) scale(1.04);
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.3));
        }

        .send-btn:active {
            transform: scale(0.92);
            transition-duration: 0.08s;
        }
        .send-btn:active::after {
            background: rgba(10, 10, 20, 0.5);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: scale(0.96);
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.08);
        }
        .send-btn:disabled::before {
            opacity: 0.1;
            filter: blur(12px);
        }
        .send-btn:disabled:hover {
            transform: scale(0.96);
        }
        .send-btn:disabled:hover svg {
            transform: none;
        }

        .send-btn--loading .btn-inner svg {
            display: none;
        }
        .send-btn--loading .btn-inner .btn-spinner {
            display: block;
        }
        .send-btn--loading:hover svg {
            transform: none;
        }
        .send-btn--loading::before {
            animation: pulseGlow 1.2s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        @keyframes pulseGlow {
            0%,
            100% {
                opacity: 0.4;
                filter: blur(16px);
            }
            50% {
                opacity: 0.8;
                filter: blur(28px);
            }
        }

        .send-btn .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0);
            animation: rippleAnim 0.6s ease-out forwards;
            pointer-events: none;
            z-index: 2;
        }
        @keyframes rippleAnim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* ============================================
               TOAST NOTIFICATIONS
            ============================================ */
        .toast-container {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            max-width: 90vw;
        }
        .toast {
            padding: 10px 22px;
            border-radius: var(--radius-md);
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 245, 255, 0.1);
            color: var(--text-primary);
            font-size: 0.85rem;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 245, 255, 0.04);
            pointer-events: auto;
            animation: toastIn 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            text-align: center;
            max-width: 100%;
        }
        .toast--error {
            border-color: rgba(255, 68, 68, 0.2);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 68, 68, 0.06);
        }
        .toast--success {
            border-color: rgba(0, 255, 136, 0.15);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 255, 136, 0.04);
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.92);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .toast--exit {
            animation: toastOut 0.3s ease-in forwards;
        }
        @keyframes toastOut {
            to {
                opacity: 0;
                transform: translateY(12px) scale(0.94);
            }
        }

        /* ============================================
               RESPONSIVE
            ============================================ */
        @media (max-width: 768px) {
            body {
                padding: 0;
            }
            .app {
                max-height: 100vh;
                max-height: 100dvh;
                border-radius: 0;
                border: none;
                box-shadow: none;
            }
            .app:hover {
                box-shadow: none;
            }
            .header {
                padding: 10px 14px;
            }
            .brand-name {
                font-size: 0.92rem;
            }
            .brand-status {
                font-size: 0.5rem;
            }
            .logo {
                width: 32px;
                height: 32px;
            }
            .logo svg {
                width: 18px;
                height: 18px;
            }
            .header-btn {
                width: 32px;
                height: 32px;
            }
            .header-btn svg {
                width: 16px;
                height: 16px;
            }
            .messages-container {
                padding: 12px 12px 4px 12px;
            }
            .message {
                max-width: 90%;
            }
            .message-bubble {
                font-size: 0.88rem;
                padding: 10px 14px;
            }
            .message-avatar {
                width: 28px;
                height: 28px;
                font-size: 0.7rem;
            }
            .input-area {
                padding: 8px 12px 10px 12px;
            }
            .input-field-wrap {
                min-height: 38px;
                padding: 2px 2px 2px 12px;
            }
            .input-field-wrap textarea {
                font-size: 0.88rem;
                padding: 8px 0;
                min-height: 20px;
            }
            .send-btn {
                width: 48px;
                height: 48px;
                min-width: 48px;
            }
            .send-btn svg {
                width: 19px;
                height: 19px;
            }
            .send-btn .btn-spinner {
                width: 19px;
                height: 19px;
            }
            .input-tool-btn {
                width: 28px;
                height: 28px;
            }
            .input-tool-btn svg {
                width: 16px;
                height: 16px;
            }
            .input-char-counter {
                font-size: 0.5rem;
                margin-bottom: 4px;
            }
            .welcome h1 {
                font-size: 1.5rem;
            }
            .welcome p {
                font-size: 0.85rem;
            }
            .suggestion-btn {
                font-size: 0.75rem;
                padding: 7px 14px;
                white-space: normal;
                word-break: break-word;
            }
            .typing-indicator {
                margin-left: 40px;
            }
            .toast-container {
                bottom: 80px;
            }
            .toast {
                font-size: 0.8rem;
                padding: 8px 16px;
            }
            .message-actions button {
                font-size: 0.6rem;
                padding: 2px 4px;
            }
            .message-actions button svg {
                width: 12px;
                height: 12px;
            }
        }

        @media (max-width: 420px) {
            .header {
                padding: 8px 10px;
                gap: 4px;
            }
            .brand-name {
                font-size: 0.8rem;
            }
            .brand-status {
                font-size: 0.45rem;
            }
            .logo {
                width: 28px;
                height: 28px;
            }
            .logo svg {
                width: 16px;
                height: 16px;
            }
            .header-btn {
                width: 28px;
                height: 28px;
            }
            .header-btn svg {
                width: 14px;
                height: 14px;
            }
            .messages-container {
                padding: 8px 8px 4px 8px;
            }
            .message {
                max-width: 94%;
                gap: 6px;
            }
            .message-bubble {
                font-size: 0.84rem;
                padding: 8px 12px;
            }
            .message-avatar {
                width: 24px;
                height: 24px;
                font-size: 0.6rem;
            }
            .input-area {
                padding: 6px 8px 8px 8px;
            }
            .input-field-wrap {
                min-height: 34px;
                padding: 2px 2px 2px 10px;
            }
            .input-field-wrap textarea {
                font-size: 0.84rem;
                padding: 6px 0;
                min-height: 18px;
            }
            .send-btn {
                width: 42px;
                height: 42px;
                min-width: 42px;
            }
            .send-btn svg {
                width: 17px;
                height: 17px;
            }
            .send-btn .btn-spinner {
                width: 17px;
                height: 17px;
            }
            .input-tool-btn {
                width: 24px;
                height: 24px;
            }
            .input-tool-btn svg {
                width: 14px;
                height: 14px;
            }
            .welcome h1 {
                font-size: 1.2rem;
            }
            .welcome-icon {
                font-size: 2.6rem;
            }
            .suggestion-btn {
                font-size: 0.7rem;
                padding: 5px 12px;
            }
            .typing-indicator {
                margin-left: 32px;
            }
            .typing-indicator .dot {
                width: 6px;
                height: 6px;
            }
        }

        @media (min-height: 800px) {
            .app {
                max-height: 820px;
            }
        }

        .header-btn:focus-visible,
        .send-btn:focus-visible,
        .suggestion-btn:focus-visible,
        .input-tool-btn:focus-visible,
        .message-actions button:focus-visible {
            outline: 2px solid var(--neon-cyan);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        .hidden {
            display: none !important;
        }

        /* ===== SETTINGS OVERLAY ===== */
        .settings-overlay {
            position: absolute;
            inset: 0;
            z-index: 50;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            animation: fadeUp 0.3s ease-out;
            border-radius: var(--radius-xl);
        }
        .settings-overlay--hidden {
            display: none;
        }
        .settings-panel {
            background: rgba(10, 10, 20, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 245, 255, 0.08);
            border-radius: var(--radius-lg);
            padding: 28px 32px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(0, 245, 255, 0.03);
            max-height: 80vh;
            overflow-y: auto;
        }
        .settings-panel h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .settings-panel h2 svg {
            width: 20px;
            height: 20px;
            stroke: var(--neon-cyan);
        }
        .settings-group {
            margin-bottom: 14px;
        }
        .settings-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .settings-group input,
        .settings-group select {
            width: 100%;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-primary);
            font-size: 0.85rem;
            font-family: var(--font-main);
            transition: var(--transition-smooth);
        }
        .settings-group input:focus,
        .settings-group select:focus {
            outline: none;
            border-color: rgba(0, 245, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.04);
        }
        .settings-close-btn {
            margin-top: 12px;
            padding: 8px 20px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition-smooth);
            font-family: var(--font-main);
            font-size: 0.85rem;
            width: 100%;
        }
        .settings-close-btn:hover {
            background: rgba(0, 245, 255, 0.06);
            color: var(--text-primary);
            border-color: rgba(0, 245, 255, 0.1);
        }
        .settings-close-btn:active {
            transform: scale(0.97);
        }
        .settings-note {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 6px;
            line-height: 1.4;
        }
        .settings-note code {
            font-family: var(--font-mono);
            background: rgba(255, 255, 255, 0.04);
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 0.65rem;
        }
    </style>
</head>
<body>

    <!-- ====== BACKGROUND ====== -->
    <canvas id="bg-canvas"></canvas>
    <div class="grid-overlay"></div>
    <div class="glow-orb glow-orb--cyan"></div>
    <div class="glow-orb glow-orb--purple"></div>
    <div class="glow-orb glow-orb--pink"></div>

    <!-- ====== TOAST CONTAINER ====== -->
    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

    <!-- ====== APP ====== -->
    <div class="app" id="app" role="main">

        <!-- ====== HEADER ====== -->
        <header class="header" role="banner">
            <div class="header-left">
                <div class="logo" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </div>
                <div class="brand">
                    <span class="brand-name">Neon AI</span>

                        <span class="status-dot" id="statusDot" role="status" aria-label="Online"></span>
                        <span id="statusLabel">Online</span>
                    </span>
                </div>
            </div>
            <div class="header-actions">
                <button class="header-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                </button>
                <button class="header-btn header-btn--danger" id="clearChatBtn" aria-label="Clear chat" title="Clear chat">

                <button class="header-btn" id="settingsBtn" aria-label="Settings" title="Settings">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
            </div>
        </header>

        <!-- ====== MAIN ====== -->
        <main class="main" id="main">

            <!-- Welcome Screen -->
            <section class="welcome" id="welcomeScreen" role="banner">
                <div class="welcome-icon" aria-hidden="true">✦</div>
                <h1>Welcome to Neon AI</h1>
                <p>Your intelligent futuristic AI assistant with reasoning.</p>
                <div class="reasoning-badge">🧠 OpenRouter &bull; Reasoning enabled</div>
                <div class="suggestions" role="list">
                    <button class="suggestion-btn" data-suggestion="How many r's are in the word 'strawberry'?" role="listitem">🍓 Count r's in strawberry</button>
                    <button class="suggestion-btn" data-suggestion="Explain artificial intelligence in simple terms" role="listitem">🧠 Explain AI</button>
                    <button class="suggestion-btn" data-suggestion="Write a simple JavaScript program that prints 'Hello, World!'" role="listitem">💻 JavaScript</button>
                    <button class="suggestion-btn" data-suggestion="Create a short sci-fi story about a sentient AI" role="listitem">📖 Create a story</button>
