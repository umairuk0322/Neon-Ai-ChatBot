            <div class="settings-overlay settings-overlay--hidden" id="settingsOverlay" role="dialog" aria-modal="true" aria-label="Settings">
                <div class="settings-panel">
                    <h2>
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                        Settings
                    </h2>
                    <div class="settings-group">
                        <label for="apiKeyInput">OpenRouter API Key</label>
                        <input type="password" id="apiKeyInput" placeholder="sk-or-v1-..." autocomplete="off" />
                        <div class="settings-note">Your key is stored locally in your browser.</div>
                    </div>
                    <div class="settings-group">
                        <label for="apiUrlInput">API Endpoint</label>
                        <input type="url" id="apiUrlInput" value="https://openrouter.ai/api/v1/chat/completions" />
                    </div>
                    <div class="settings-group">
                        <label for="modelInput">Model</label>
                        <input type="text" id="modelInput" value="openrouter/free" />
                    </div>
                    <div class="settings-group">
                        <label for="reasoningToggle">Reasoning</label>
                        <select id="reasoningToggle">
                            <option value="enabled" selected>Enabled</option>
                            <option value="disabled">Disabled</option>
                        </select>
                        <div class="settings-note">When enabled, the AI will "think" step by step.</div>
                    </div>
                    <button class="settings-close-btn" id="settingsCloseBtn">Close Settings</button>
                </div>
            </div>

        </main>

        <!-- ====== INPUT AREA ====== -->
        <footer class="input-area" role="form">
            <div class="input-wrapper">
                <div class="input-field-wrap">
                    <textarea id="chatInput" rows="1" placeholder="Ask Neon AI anything..." aria-label="Chat input" maxlength="2000"></textarea>
                    <span class="input-char-counter" id="charCounter" aria-live="polite">0 / 2000</span>
                </div>
                <div class="input-tools">
                    <button class="input-tool-btn" id="attachBtn" aria-label="Attach file" title="Attach (coming soon)" disabled>
                        <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                    </button>
                    <button class="input-tool-btn" id="micBtn" aria-label="Voice input" title="Voice (coming soon)" disabled>
                        <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v4"/></svg>
                    </button>
                </div>
                <button class="send-btn" id="sendBtn" aria-label="Send message" title="Send message">
                    <span class="btn-inner">
                        <svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                        <span class="btn-spinner"></span>
                    </span>
                </button>
            </div>
        </footer>
    </div>

    <script>
        /* ==============================================================
               CONFIGURATION — OpenRouter API
               ==============================================================
               Uses the provided OpenRouter API key with reasoning support.
               ============================================================== */
        const CONFIG = {
            // ★★★ Your OpenRouter API Key ★★★
            API_KEY: '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',
            API_URL: 'https://openrouter.ai/api/v1/chat/completions',
            MODEL: 'openrouter/free',
            REASONING_ENABLED: true,
            MAX_TOKENS: 800,
            TEMPERATURE: 0.7,
            SYSTEM_PROMPT: 'You are Neon AI, a futuristic, helpful, and intelligent assistant with reasoning capabilities. Respond in a clear, friendly, and informative manner. Use markdown for formatting when appropriate.',
        };

        /* ==============================================================
               STATE
            ============================================================== */
        const state = {
            messages: [], // { id, type, content, timestamp, reasoning_details? }
            theme: 'dark',
            isProcessing: false,
            settings: {
                apiKey: CONFIG.API_KEY || '',
                apiUrl: CONFIG.API_URL || '',
                model: CONFIG.MODEL || '',
                reasoningEnabled: CONFIG.REASONING_ENABLED,
            },
        };

        /* ==============================================================
               DOM REFS
            ============================================================== */
        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => document.querySelectorAll(sel);

        const dom = {
            app: $('#app'),
            messagesContainer: $('#messagesContainer'),
            welcomeScreen: $('#welcomeScreen'),
            chatInput: $('#chatInput'),
            sendBtn: $('#sendBtn'),
            charCounter: $('#charCounter'),
            typingIndicator: $('#typingIndicator'),
            statusDot: $('#statusDot'),
            statusLabel: $('#statusLabel'),
            clearChatBtn: $('#clearChatBtn'),
            themeToggle: $('#themeToggle'),
            settingsBtn: $('#settingsBtn'),
            settingsOverlay: $('#settingsOverlay'),
            settingsCloseBtn: $('#settingsCloseBtn'),
            apiKeyInput: $('#apiKeyInput'),
            apiUrlInput: $('#apiUrlInput'),
            modelInput: $('#modelInput'),
            reasoningToggle: $('#reasoningToggle'),
            toastContainer: $('#toastContainer'),
            attachBtn: $('#attachBtn'),
            micBtn: $('#micBtn'),
            canvas: $('#bg-canvas'),
        };

        /* ==============================================================
               UTILITY FUNCTIONS
            ============================================================== */
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        }

        function formatTime(ts) {
            const d = new Date(ts);
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatMessageContent(text) {
            let html = escapeHtml(text);
            html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            html = html.replace(/\n/g, '<br />');
            return html;
        }

        /* ==============================================================
               TOAST NOTIFICATIONS
            ============================================================== */
        function showToast(message, type, duration = 2800) {
            const container = dom.toastContainer;
            const toast = document.createElement('div');
            toast.className = `toast ${type === 'error' ? 'toast--error' : ''} ${type === 'success' ? 'toast--success' : ''}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('toast--exit');
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        /* ==============================================================
               LOCAL STORAGE
            ============================================================== */
        function loadState() {
            try {
                const saved = localStorage.getItem('neon_ai_state_v2');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    state.messages = parsed.messages || [];
                    state.theme = parsed.theme || 'dark';
                    state.settings = parsed.settings || {
                        apiKey: CONFIG.API_KEY,
                        apiUrl: CONFIG.API_URL,
                        model: CONFIG.MODEL,
                        reasoningEnabled: CONFIG.REASONING_ENABLED,
                    };
                    // Sync settings
                    CONFIG.API_KEY = state.settings.apiKey || CONFIG.API_KEY;
                    CONFIG.API_URL = state.settings.apiUrl || CONFIG.API_URL;
                    CONFIG.MODEL = state.settings.model || CONFIG.MODEL;
                    CONFIG.REASONING_ENABLED = state.settings.reasoningEnabled !== undefined ?
                        state.settings.reasoningEnabled :
                        CONFIG.REASONING_ENABLED;
                    // Update input fields
                    if (dom.apiKeyInput) dom.apiKeyInput.value = state.settings.apiKey || '';
                    if (dom.apiUrlInput) dom.apiUrlInput.value = state.settings.apiUrl || CONFIG.API_URL;
                    if (dom.modelInput) dom.modelInput.value = state.settings.model || CONFIG.MODEL;
                    if (dom.reasoningToggle) {
                        dom.reasoningToggle.value = state.settings.reasoningEnabled ? 'enabled' : 'disabled';
                    }
                    return true;
                }
            } catch (_) { /* ignore */ }
            return false;
        }

        function saveState() {
            try {
                const data = {
                    messages: state.messages,
                    theme: state.theme,
                    settings: state.settings,
                };
                localStorage.setItem('neon_ai_state_v2', JSON.stringify(data));
            } catch (_) { /* ignore */ }
        }

        /* ==============================================================
               RENDER — Messages
            ============================================================== */
        function renderMessages() {
            const container = dom.messagesContainer;
            if (state.messages.length === 0) {
                container.classList.add('hidden');
                dom.welcomeScreen.classList.remove('hidden');
                return;
            }
            container.classList.remove('hidden');
            dom.welcomeScreen.classList.add('hidden');

            container.innerHTML = '';
            state.messages.forEach((msg) => {
                const el = createMessageElement(msg);
                container.appendChild(el);
            });
            scrollToBottom();
        }

        function createMessageElement(msg) {
            const isUser = msg.type === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `message message--${isUser ? 'user' : 'ai'}`;
            wrapper.dataset.id = msg.id;
            wrapper.setAttribute('role', 'article');
            wrapper.setAttribute('aria-label', `${isUser ? 'You' : 'Neon AI'}, ${formatTime(msg.timestamp)}`);

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.setAttribute('aria-hidden', 'true');
            avatar.textContent = isUser ? 'U' : '✦';
            wrapper.appendChild(avatar);

            const bubbleWrap = document.createElement('div');
            bubbleWrap.className = 'message-bubble-wrap';

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.innerHTML = isUser ? escapeHtml(msg.content) : formatMessageContent(msg.content);
            bubbleWrap.appendChild(bubble);

            // Reasoning badge for AI messages with reasoning_details
            if (!isUser && msg.reasoning_details) {
                const badge = document.createElement('div');
                badge.className = 'reasoning-badge-msg';
                badge.innerHTML =
                    `<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/><path d="M12 6v6l4 2"/></svg> Reasoning`;
                bubbleWrap.appendChild(badge);
            }

            const time = document.createElement('span');
            time.className = 'message-time';
            time.textContent = formatTime(msg.timestamp);
            bubbleWrap.appendChild(time);

            const actions = document.createElement('div');
            actions.className = 'message-actions';
            actions.setAttribute('role', 'group');
            actions.setAttribute('aria-label', 'Message actions');

            const copyBtn = document.createElement('button');
            copyBtn.className = 'copy-btn';
            copyBtn.setAttribute('aria-label', 'Copy message');
            copyBtn.innerHTML =
                `<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
            copyBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                copyMessage(msg.id);
            });
            actions.appendChild(copyBtn);

            const delBtn = document.createElement('button');
            delBtn.className = 'del-btn';
            delBtn.setAttribute('aria-label', 'Delete message');
            delBtn.innerHTML =
                `<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>`;
            delBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                deleteMessage(msg.id);
            });
            actions.appendChild(delBtn);

            bubbleWrap.appendChild(actions);
            wrapper.appendChild(bubbleWrap);
            return wrapper;
        }

        function scrollToBottom() {
            const container = dom.messagesContainer;
            requestAnimationFrame(() => {
                container.scrollTop = container.scrollHeight;
            });
        }

        /* ==============================================================
               MESSAGE OPERATIONS
            ============================================================== */
        function addMessage(type, content, reasoning_details = null) {
            const msg = {
                id: generateId(),
                type: type,
                content: content.trim(),
                timestamp: Date.now(),
                reasoning_details: reasoning_details || null,
            };
            state.messages.push(msg);
            saveState();
            renderMessages();
            return msg;
        }

        function deleteMessage(id) {
            state.messages = state.messages.filter((m) => m.id !== id);
            saveState();
            renderMessages();
            if (state.messages.length === 0) {
                dom.welcomeScreen.classList.remove('hidden');
                dom.messagesContainer.classList.add('hidden');
            }
            showToast('Message deleted', 'success', 1600);
        }

        function copyMessage(id) {
            const msg = state.messages.find((m) => m.id === id);
            if (!msg) return;
            navigator.clipboard.writeText(msg.content).then(() => {
                showToast('Copied to clipboard', 'success', 1600);
                const container = dom.messagesContainer;
                const msgEl = container.querySelector(`[data-id="${id}"]`);
                if (msgEl) {
                    const btn = msgEl.querySelector('.copy-btn');
                    if (btn) {
                        btn.classList.add('copy-btn--copied');
                        setTimeout(() => btn.classList.remove('copy-btn--copied'), 1600);
                    }
                }
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = msg.content;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('Copied to clipboard', 'success', 1600);
            });
        }

        function clearAllMessages() {
            if (state.messages.length === 0) return;
            if (!confirm('Clear all messages?')) return;
            state.messages = [];
            saveState();
            renderMessages();
            dom.welcomeScreen.classList.remove('hidden');
            dom.messagesContainer.classList.add('hidden');
            showToast('Chat cleared', 'success', 1600);
        }

        function exportConversation() {
            if (state.messages.length === 0) {
                showToast('No messages to export', 'error', 1800);
                return;
            }
            const lines = state.messages.map((m) => {
                const label = m.type === 'user' ? 'You' : 'Neon AI';
                const time = formatTime(m.timestamp);
                let extra = '';
                if (m.reasoning_details) extra = ' [with reasoning]';
                return `[${time}] ${label}${extra}:\n${m.content}\n`;
            });
            const text = `Neon AI Conversation (OpenRouter)\n${'='.repeat(50)}\n\n${lines.join('\n')}`;
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `neon-ai-chat-${new Date().toISOString().slice(0, 10)}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('Conversation exported', 'success', 1800);
        }

        function searchConversation(query) {
            if (!query.trim()) { renderMessages(); return; }
            const q = query.trim().toLowerCase();
            const container = dom.messagesContainer;
            const items = container.querySelectorAll('.message');
            let found = 0;
            items.forEach((el) => {
                const id = el.dataset.id;
                const msg = state.messages.find((m) => m.id === id);
                if (msg && msg.content.toLowerCase().includes(q)) {
                    el.style.display = 'flex';
                    found++;
                } else {
                    el.style.display = 'none';
                }
            });
            if (found === 0) showToast('No messages found', 'error', 1600);
        }

        /* ==============================================================
               TYPING INDICATOR
            ============================================================== */
        function showTyping() {
            dom.typingIndicator.classList.add('typing-indicator--active');
            scrollToBottom();
        }

        function hideTyping() {
            dom.typingIndicator.classList.remove('typing-indicator--active');
        }

        /* ==============================================================
               OPENROUTER API — Reasoning Integration
            ============================================================== */

        /**
         * Builds the messages array for the API call, preserving reasoning_details
         * for assistant messages that have them.
         */
        function buildApiMessages(includeSystem = true) {
            const msgs = [];
            if (includeSystem) {
                msgs.push({ role: 'system', content: CONFIG.SYSTEM_PROMPT });
            }
            // Get last 20 messages for context
            const recent = state.messages.slice(-20);
            for (const m of recent) {
                if (m.type === 'user') {
                    msgs.push({ role: 'user', content: m.content });
                } else if (m.type === 'ai') {
                    const entry = { role: 'assistant', content: m.content };
                    // Preserve reasoning_details if present (OpenRouter feature)
                    if (m.reasoning_details) {
                        entry.reasoning_details = m.reasoning_details;
                    }
                    msgs.push(entry);
                }
            }
            return msgs;
        }

        /**
         * Calls OpenRouter API with reasoning support.
         * Follows the pattern from the TypeScript code:
         * - First call: reasoning: { enabled: true }
         * - Subsequent calls: include reasoning_details from previous response
         */
        async function callOpenRouter(userMessage) {
            const apiKey = CONFIG.API_KEY || state.settings.apiKey;
            const apiUrl = CONFIG.API_URL || state.settings.apiUrl;
            const model = CONFIG.MODEL || state.settings.model;
            const reasoningEnabled = state.settings.reasoningEnabled !== undefined ?
                state.settings.reasoningEnabled :
                CONFIG.REASONING_ENABLED;

            if (!apiKey) {
                throw new Error('OpenRouter API key is required. Please set it in Settings.');
            }
            if (!apiUrl) {
                throw new Error('OpenRouter API URL is required.');
            }

            // Build messages - include system and history with reasoning_details
            const messages = buildApiMessages(true);

            // Add the current user message
            messages.push({ role: 'user', content: userMessage });

            const payload = {
                model: model,
                messages: messages,
                max_tokens: CONFIG.MAX_TOKENS,
                temperature: CONFIG.TEMPERATURE,
            };

            // Add reasoning if enabled
            if (reasoningEnabled) {
                payload.reasoning = { enabled: true };
            }

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json',
                    'HTTP-Referer': window.location.origin,
                    'X-Title': 'Neon AI Chatbot',
                },
                body: JSON.stringify(payload),
            });

            if (!response.ok) {
                let errMsg = `API error: ${response.status}`;
                try {
                    const errData = await response.json();
                    if (errData.error && errData.error.message) {
                        errMsg = errData.error.message;
                    } else if (errData.message) {
                        errMsg = errData.message;
                    }
                } catch (_) { /* ignore */ }
                throw new Error(errMsg);
            }

            const data = await response.json();
            const choice = data.choices?.[0];
            if (!choice) {
                throw new Error('No response from API');
            }

            const message = choice.message;
            const content = message?.content || '';
            if (!content) {
                throw new Error('Empty response from API');
            }

            // Extract reasoning_details if present (OpenRouter-specific)
            let reasoningDetails = null;
            if (message && typeof message.reasoning_details !== 'undefined') {
                reasoningDetails = message.reasoning_details;
            }

            return {
                content: content.trim(),
                reasoning_details: reasoningDetails,
            };
        }

        /* ==============================================================
               CHAT FLOW
            ============================================================== */
        async function handleSend() {
            const input = dom.chatInput;
            const text = input.value.trim();
            if (!text || state.isProcessing) return;

            state.isProcessing = true;
            dom.sendBtn.disabled = true;
            dom.sendBtn.classList.add('send-btn--loading');

            // Add user message
            addMessage('user', text);
            input.value = '';
            updateCharCounter();
            input.style.height = 'auto';

            showTyping();

            try {
                const result = await callOpenRouter(text);
                hideTyping();
                // Add AI message with reasoning_details if present
                addMessage('ai', result.content, result.reasoning_details);
                if (result.reasoning_details) {
                    // Optional: log that reasoning was used
                    console.log('🧠 Reasoning used for this response.');
                }
            } catch (err) {
                hideTyping();
                const errorMsg = err.message || 'Something went wrong. Please try again.';
                showToast(`Error: ${errorMsg}`, 'error', 3500);
                addMessage('ai', `⚠️ I encountered an issue: ${errorMsg}\n\nPlease check your API configuration or try again later.`);
            } finally {
                state.isProcessing = false;
                dom.sendBtn.disabled = false;
                dom.sendBtn.classList.remove('send-btn--loading');
                dom.chatInput.focus();
            }
        }

        /* ==============================================================
               INPUT HANDLING
            ============================================================== */
        function updateCharCounter() {
            const input = dom.chatInput;
            const count = input.value.length;
            const max = 2000;
            dom.charCounter.textContent = `${count} / ${max}`;
            dom.charCounter.classList.remove('input-char-counter--near-limit', 'input-char-counter--limit');
            if (count > max * 0.85) dom.charCounter.classList.add('input-char-counter--near-limit');
            if (count >= max) dom.charCounter.classList.add('input-char-counter--limit');
        }

        function autoResizeTextarea() {
            const el = dom.chatInput;
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 120) + 'px';
        }

        /* ==============================================================
               THEME
            ============================================================== */
        function toggleTheme() {
            state.theme = state.theme === 'light' ? 'dark' : 'light';
            applyTheme();
            saveState();
            showToast(`Theme: ${state.theme}`, 'success', 1200);
        }

        function applyTheme() {
            const root = document.documentElement;
            if (state.theme === 'light') {
                root.style.setProperty('--bg-dark', '#f0f0f8');
                root.style.setProperty('--text-primary', '#0a0a12');
                root.style.setProperty('--text-secondary', '#3a3a50');
                root.style.setProperty('--text-muted', '#6a6a80');
                root.style.setProperty('--bg-panel', 'rgba(240, 240, 248, 0.85)');
                root.style.setProperty('--glass-border', 'rgba(0,0,0,0.06)');
                document.querySelector('.app').style.borderColor = 'rgba(0,0,0,0.04)';
            } else {
                root.style.setProperty('--bg-dark', '#0a0a12');
                root.style.setProperty('--text-primary', '#f0f0ff');
                root.style.setProperty('--text-secondary', '#a0a0c0');
                root.style.setProperty('--text-muted', '#606080');
                root.style.setProperty('--bg-panel', 'rgba(10, 10, 20, 0.75)');
                root.style.setProperty('--glass-border', 'rgba(255,255,255,0.08)');
                document.querySelector('.app').style.borderColor = 'var(--glass-border)';
            }
        }

        /* ==============================================================
               SETTINGS
            ============================================================== */
        function openSettings() {
            dom.settingsOverlay.classList.remove('settings-overlay--hidden');
            dom.apiKeyInput.value = state.settings.apiKey || '';
            dom.apiUrlInput.value = state.settings.apiUrl || CONFIG.API_URL;
            dom.modelInput.value = state.settings.model || CONFIG.MODEL;
            dom.reasoningToggle.value = state.settings.reasoningEnabled ? 'enabled' : 'disabled';
            dom.apiKeyInput.focus();
        }

        function closeSettings() {
            dom.settingsOverlay.classList.add('settings-overlay--hidden');
            const key = dom.apiKeyInput.value.trim();
            const url = dom.apiUrlInput.value.trim();
            const model = dom.modelInput.value.trim();
            const reasoning = dom.reasoningToggle.value === 'enabled';

            state.settings.apiKey = key;
            state.settings.apiUrl = url || CONFIG.API_URL;
            state.settings.model = model || CONFIG.MODEL;
            state.settings.reasoningEnabled = reasoning;

            CONFIG.API_KEY = key;
            CONFIG.API_URL = state.settings.apiUrl;
            CONFIG.MODEL = state.settings.model;
            CONFIG.REASONING_ENABLED = reasoning;

            saveState();
            showToast('Settings saved', 'success', 1600);
        }

        /* ==============================================================
               BACKGROUND PARTICLES
            ============================================================== */
        function initParticles() {
            const canvas = dom.canvas;
            const ctx = canvas.getContext('2d');
            let w, h;
            let particles = [];
            const COUNT = 120;
            const MAX_SPEED = 0.3;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() {
                    this.reset();
                    this.y = Math.random() * h;
                    this.x = Math.random() * w;
                }
                reset() {
                    this.x = Math.random() * w;
                    this.y = Math.random() * h;
                    this.size = Math.random() * 2 + 0.5;
                    this.speedX = (Math.random() - 0.5) * MAX_SPEED * 2;
                    this.speedY = (Math.random() - 0.5) * MAX_SPEED * 2;
                    this.opacity = Math.random() * 0.5 + 0.1;
                    this.hue = Math.random() > 0.5 ? 180 : 270;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x < 0 || this.x > w) { this.speedX *= -1;
                        this.x = Math.max(0, Math.min(w, this.x)); }
                    if (this.y < 0 || this.y > h) { this.speedY *= -1;
                        this.y = Math.max(0, Math.min(h, this.y)); }
                }
                draw() {
                    const color = this.hue === 180 ? '0, 245, 255' : '180, 0, 255';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${color}, ${this.opacity})`;
                    ctx.fill();
                    ctx.shadowColor = `rgba(${color}, ${this.opacity * 0.3})`;
                    ctx.shadowBlur = 8;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            for (let i = 0; i < COUNT; i++) {
                particles.push(new Particle());
            }

            let mouseX = -9999,
                mouseY = -9999;
            document.addEventListener('mousemove', (e) => { mouseX = e.clientX;
                mouseY = e.clientY; });
            document.addEventListener('mouseleave', () => { mouseX = -9999;
                mouseY = -9999; });

            function drawConnections() {
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 150) {
                            const alpha = (1 - dist / 150) * 0.12;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(0, 245, 255, ${alpha})`;
                            ctx.lineWidth = 0.6;
                            ctx.stroke();
                        }
                    }
                }
                if (mouseX > 0 && mouseY > 0) {
                    for (const p of particles) {
                        const dx = p.x - mouseX;
                        const dy = p.y - mouseY;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 200) {
                            const alpha = (1 - dist / 200) * 0.08;
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(mouseX, mouseY);
                            ctx.strokeStyle = `rgba(180, 0, 255, ${alpha})`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    }
                }
            }

            function animate() {
                ctx.clearRect(0, 0, w, h);
                for (const p of particles) {
                    p.update();
                    p.draw();
                }
                drawConnections();
                requestAnimationFrame(animate);
            }
            animate();
            window.addEventListener('orientationchange', () => { setTimeout(resize, 300); });
        }

        /* ==============================================================
               KEYBOARD SHORTCUTS
            ============================================================== */
        function handleKeyboard(e) {
            if (e.ctrlKey && e.shiftKey && e.key === 'C') { e.preventDefault();
                clearAllMessages(); }
            if (e.ctrlKey && e.shiftKey && e.key === 'E') { e.preventDefault();
                exportConversation(); }
            if (e.ctrlKey && e.key === 'k') { e.preventDefault();
                dom.chatInput.focus(); }
            if (e.key === 'Escape') {
                if (!dom.settingsOverlay.classList.contains('settings-overlay--hidden')) {
                    closeSettings();
                }
                dom.chatInput.blur();
            }
        }

        /* ==============================================================
               INIT
            ============================================================== */
        function init() {
            const hasSaved = loadState();
            applyTheme();
            renderMessages();

            if (state.messages.length > 0) {
                dom.welcomeScreen.classList.add('hidden');
                dom.messagesContainer.classList.remove('hidden');
            }

            dom.statusDot.classList.remove('status-dot--offline');
            dom.statusLabel.textContent = 'Online';
            initParticles();

            // --- Event listeners ---
            dom.sendBtn.addEventListener('click', handleSend);

            dom.chatInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSend();
                }
            });

            dom.chatInput.addEventListener('input', () => {
                updateCharCounter();
                autoResizeTextarea();
            });

            $$('.suggestion-btn').forEach((btn) => {
                btn.addEventListener('click', () => {
                    const text = btn.dataset.suggestion;
                    if (text) {
                        dom.chatInput.value = text;
                        updateCharCounter();
                        autoResizeTextarea();
                        dom.chatInput.focus();
                        setTimeout(handleSend, 120);
                    }
                });
            });

            dom.clearChatBtn.addEventListener('click', clearAllMessages);
            dom.themeToggle.addEventListener('click', toggleTheme);
            dom.settingsBtn.addEventListener('click', openSettings);
            dom.settingsCloseBtn.addEventListener('click', closeSettings);
            dom.settingsOverlay.addEventListener('click', (e) => {
                if (e.target === dom.settingsOverlay) closeSettings();
            });
            document.addEventListener('keydown', handleKeyboard);

            document.querySelector('.header').addEventListener('dblclick', (e) => {
                if (e.target.closest('.header-btn')) return;
                exportConversation();
            });

            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 'f') {
                    e.preventDefault();
                    const query = prompt('Search conversation:');
                    if (query !== null) searchConversation(query);
                }
            });

            setTimeout(() => dom.chatInput.focus(), 400);

            // Status flicker for ambiance
            setInterval(() => {
                if (Math.random() < 0.02) {
                    dom.statusDot.classList.add('status-dot--offline');
                    dom.statusLabel.textContent = 'Reconnecting...';
                    setTimeout(() => {
                        dom.statusDot.classList.remove('status-dot--offline');
                        dom.statusLabel.textContent = 'Online';
                    }, 800);
                }
            }, 8000);

            console.log('✦ Neon AI (OpenRouter) initialized ✦');
            console.log('🧠 Reasoning:', CONFIG.REASONING_ENABLED ? 'Enabled' : 'Disabled');
            console.log('📋 Shortcuts: Ctrl+Shift+C = Clear, Ctrl+Shift+E = Export, Ctrl+K = Focus, Ctrl+F = Search');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
